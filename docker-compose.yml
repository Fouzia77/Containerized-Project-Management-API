version: "3.8"


services:

  db:
    image: postgres:15-alpine

    container_name: project_db

    environment:
      POSTGRES_DB: project_management_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - db_data:/var/lib/postgresql/data


    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U user -d project_management_db"
        ]

      interval: 5s
      timeout: 5s
      retries: 5



  api:

    build: .

    container_name: project_api

    ports:
      - "8000:8000"


    environment:

      DATABASE_URL:
        postgresql://user:password@db:5432/project_management_db

      SECRET_KEY:
        supersecretkey


    depends_on:

      db:
        condition: service_healthy


volumes:

 db_data: